name: Release ARM64 Debian Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-arm64-deb:
    name: Build arm64 .deb package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - name: Build and package in Ubuntu arm64 container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -e DEB_VERSION="${{ steps.version.outputs.version }}" \
            -v "${{ github.workspace }}:/work" -w /work \
            ubuntu:22.04 bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build g++ pkg-config dpkg-dev \
                libsqlite3-dev libgpiod-dev libssl-dev libnfc-dev \
                libcurl4-openssl-dev libfmt-dev nlohmann-json3-dev \
                libc-ares-dev libfreetype6-dev ca-certificates git

              cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DUNIX_FOLDER_CONVENTION=ON -DKEYBOARD_TYPE=VID \
                -DDISPLAY_TYPE=ST7565
              cmake --build build-arm64 --config Release -j$(nproc)

              rm -rf pkgroot dist
              mkdir -p pkgroot/DEBIAN dist
              cmake --install build-arm64 --prefix /work/pkgroot/opt/fuelflux

              mkdir -p /work/pkgroot/opt/fuelflux/config
              install -m 0644 /work/deploy/logging.json /work/pkgroot/opt/fuelflux/config/logging.json

              mkdir -p /work/pkgroot/lib/systemd/system
              install -m 0644 /work/deploy/fuelflux.service /work/pkgroot/lib/systemd/system/fuelflux.service

              install -m 0644 /work/deploy/debian/control /work/pkgroot/DEBIAN/control
              sed -i "s/@DEB_VERSION@/${DEB_VERSION}/g; s/@DEB_ARCH@/arm64/g" /work/pkgroot/DEBIAN/control
              install -m 0755 /work/deploy/debian/postinst /work/pkgroot/DEBIAN/postinst
              install -m 0755 /work/deploy/debian/prerm /work/pkgroot/DEBIAN/prerm

              dpkg-deb --build --root-owner-group /work/pkgroot "/work/dist/fuelflux_${DEB_VERSION}_arm64.deb"
              install -m 0755 /work/pkgroot/opt/fuelflux/bin/fuelflux "/work/dist/fuelflux_${DEB_VERSION}_arm64"
              cd /work/dist
              sha256sum "fuelflux_${DEB_VERSION}_arm64.deb" "fuelflux_${DEB_VERSION}_arm64" > SHA256SUMS
            '

      - name: Test Debian install/uninstall in Ubuntu arm64 container
        shell: bash
        env:
          DEB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -e DEB_VERSION="${DEB_VERSION}" \
            -v "${{ github.workspace }}:/work" -w /work \
            ubuntu:22.04 bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends passwd adduser binutils file

              cat > /usr/local/bin/systemctl << "EOF"
              #!/bin/sh
              # Simulate systemctl being present but unusable in a non-systemd container.
              exit 1
              EOF
              chmod 755 /usr/local/bin/systemctl

              deb_pkg="/work/dist/fuelflux_${DEB_VERSION}_arm64.deb"
              if [[ ! -f "${deb_pkg}" ]]; then
                echo "Expected package not found: ${deb_pkg}" >&2
                exit 1
              fi
              # Resolve only the declared package dependencies in a clean image.
              apt-get install -y --no-install-recommends "${deb_pkg}"

              test -x /opt/fuelflux/bin/fuelflux
              test -f /lib/systemd/system/fuelflux.service
              getent passwd fuelflux > /dev/null

              raw="/work/dist/fuelflux_${DEB_VERSION}_arm64"
              test -s "${raw}"
              test "$(dpkg-deb -f "${deb_pkg}" Architecture)" = arm64
              readelf -h "${raw}" | grep -E "Machine:.*AArch64"
              file "${raw}" | grep -E "ELF 64-bit.*ARM aarch64"
              cmp "${raw}" /opt/fuelflux/bin/fuelflux
              # ldd must succeed and every runtime library must be available.
              ldd "${raw}" > /tmp/fuelflux-ldd.txt
              cat /tmp/fuelflux-ldd.txt
              if grep -q "not found" /tmp/fuelflux-ldd.txt; then exit 1; fi
              cd /work/dist
              test "$(wc -l < SHA256SUMS)" -eq 2
              sha256sum -c SHA256SUMS

              # Upgrades and removal must retain per-device settings and data.
              printf "FUELFLUX_CONTROLLER_ID=000-factory-test\nFUELFLUX_BACKEND_URL=https://example.org/fleet\n" > /etc/fuelflux/fuelflux.env
              printf "preserve-data\n" > /var/fuelflux/db/installation-test
              cp /etc/fuelflux/fuelflux.env /tmp/expected.env
              dpkg -i "${deb_pkg}"
              cmp /etc/fuelflux/fuelflux.env /tmp/expected.env

              dpkg -r fuelflux
              test ! -e /opt/fuelflux/bin/fuelflux
              cmp /etc/fuelflux/fuelflux.env /tmp/expected.env
              grep -qx preserve-data /var/fuelflux/db/installation-test
            '

      - name: Upload arm64 deb artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: fuelflux-deb-arm64
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload standalone arm64 executable and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: fuelflux-binary-arm64
          path: |
            dist/fuelflux_${{ steps.version.outputs.version }}_arm64
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-arm64-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download deb artifact
        uses: actions/download-artifact@v8
        with:
          name: fuelflux-deb-arm64
          path: dist

      - name: Download standalone executable and checksums
        uses: actions/download-artifact@v8
        with:
          name: fuelflux-binary-arm64
          path: dist

      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          test -s "fuelflux_${version}_arm64.deb"
          test -s "fuelflux_${version}_arm64"
          test "$(wc -l < SHA256SUMS)" -eq 2
          sha256sum -c SHA256SUMS
          dpkg-deb -x "fuelflux_${version}_arm64.deb" ../release-extracted
          cmp "fuelflux_${version}_arm64" ../release-extracted/opt/fuelflux/bin/fuelflux

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/fuelflux_*_arm64.deb
            dist/fuelflux_*_arm64
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
