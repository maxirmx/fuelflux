name: Build FuelFlux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true    

jobs:
  build-x64:
    name: Build Ubuntu x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore CMake deps cache
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: ${{ runner.os }}-fuelflux-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fuelflux-cmake-deps-

      - name: Install dependencies
        # Do not install spdlog library. It depends on specific version of fmt, and it may be different from what you have or get installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev libgpiod-dev \
               build-essential cmake ninja-build g++ ca-certificates git libssl-dev libnfc-dev   \
               libcurl4-openssl-dev libfmt-dev nlohmann-json3-dev libc-ares-dev libfreetype6-dev

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                                          -DENABLE_TESTING=ON \
                                          -DCODE_COVERAGE=ON \
                                          -DTARGET_REAL_FLOW_METER=OFF \
                                          -DDISPLAY_TYPE=CONSOLE \
                                          -DKEYBOARD_TYPE=CONSOLE \
                                          -DUNIX_FOLDER_CONVENTION=OFF

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure -C Release

      - name: Generate coverage report
        run: |
          # Install lcov if not present
          sudo apt-get install -y lcov
          # Capture coverage excluding test directories, dependencies, and system files from the start
          lcov --capture --directory build --output-file coverage.info \
            --exclude '*/tests/*' \
            --exclude '*_test.cpp' \
            --exclude '*test.cpp' \
            --exclude '*/build/_deps/*' \
            --exclude '/usr/*' \
            --exclude '*/CMakeFiles/*'
     

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  keyboard-builds:
    name: Keyboard ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-vid
            keyboard_args: ''
          - name: vid-port-a
            keyboard_args: '-DKEYBOARD_TYPE=VID -DKEYBOARD_MCP_PORT=A'
          - name: vid-port-b
            keyboard_args: '-DKEYBOARD_TYPE=VID -DKEYBOARD_MCP_PORT=B'
          - name: legacy-port-a
            keyboard_args: '-DKEYBOARD_TYPE=LEGACY -DKEYBOARD_MCP_PORT=A'
          - name: legacy-port-b
            keyboard_args: '-DKEYBOARD_TYPE=LEGACY -DKEYBOARD_MCP_PORT=B'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev \
               build-essential cmake ninja-build g++ ca-certificates git libssl-dev \
               libcurl4-openssl-dev libfmt-dev nlohmann-json3-dev

      - name: Configure keyboard variant
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                                          -DDISPLAY_TYPE=CONSOLE \
                                          -DTARGET_SIM800C=OFF \
                                          -DTARGET_REAL_CARD_READER=OFF \
                                          -DTARGET_REAL_PUMP=OFF \
                                          -DTARGET_REAL_FLOW_METER=OFF \
                                          -DENABLE_TESTING=OFF \
                                          -DUNIX_FOLDER_CONVENTION=OFF \
                                          ${{ matrix.keyboard_args }}

      - name: Verify non-MSVC default
        if: matrix.name == 'default-vid'
        run: grep -q '^KEYBOARD_TYPE:STRING=VID$' build/CMakeCache.txt

      - name: Verify rejected keyboard configurations
        if: matrix.name == 'default-vid'
        run: |
          if cmake -S . -B invalid-old-option -DTARGET_REAL_KEYBOARD=ON; then
            echo "TARGET_REAL_KEYBOARD was unexpectedly accepted"
            exit 1
          fi
          if cmake -S . -B invalid-type -DKEYBOARD_TYPE=UNKNOWN; then
            echo "Invalid KEYBOARD_TYPE was unexpectedly accepted"
            exit 1
          fi
          if cmake -S . -B invalid-port -DKEYBOARD_MCP_PORT=C; then
            echo "Invalid KEYBOARD_MCP_PORT was unexpectedly accepted"
            exit 1
          fi
          if cmake -S . -B invalid-threshold -DKEYBOARD_LONG_PRESS_MS=0; then
            echo "Invalid KEYBOARD_LONG_PRESS_MS was unexpectedly accepted"
            exit 1
          fi

      - name: Build keyboard variant
        run: cmake --build build --config Release -j$(nproc)

  keyboard-default-msvc:
    name: Keyboard default MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            curl:x64-windows sqlite3:x64-windows

      - name: Configure default keyboard
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DENABLE_TESTING=OFF `
            -DUNIX_FOLDER_CONVENTION=OFF

      - name: Verify MSVC default
        shell: pwsh
        run: |
          $cacheEntry = Select-String -Path build/CMakeCache.txt `
            -Pattern '^KEYBOARD_TYPE:STRING=CONSOLE$'
          if (-not $cacheEntry) {
            throw "MSVC did not default to KEYBOARD_TYPE=CONSOLE"
          }

      - name: Build default keyboard
        run: cmake --build build --config Release -j 2
